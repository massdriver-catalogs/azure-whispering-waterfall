name: azure-orders-worker-service
version: 0.1.0
label: Orders Worker Service
icon: https://raw.githubusercontent.com/massdriver-catalogs/azure/main/bundles/azure-app-service/icon.svg

ui:
  connectionOrientation: link

schema:
  title: Orders Worker Service
  description: The Orders Worker Function app. It reads order events from the queue.
