name: azure-orders-api
description: The Orders API. A TypeScript Azure Function app with an HTTP route that says hello. It runs on the azure-function-nodejs runtime.
source_url: https://github.com/massdriver-catalogs/azure/tree/main/apps/orders-api
version: 0.1.0

app:
  runtime: azure-function-nodejs@latest+dev
  envs:
    SERVICE_NAME: .params.md_metadata.name_prefix

resources:
  service:
    resource_type: azure-orders-api-service@0.1.0
    required: true

steps:
  - path: src
    resources:
      service:
        template: |
          {
            name: .outputs.function_app_name,
            url: .outputs.url
          }
