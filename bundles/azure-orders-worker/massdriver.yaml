name: azure-orders-worker
description: The Orders Worker. A TypeScript Azure Function app with a queue trigger that reads the order events. It runs on the azure-function-nodejs runtime.
source_url: https://github.com/massdriver-catalogs/azure/tree/main/apps/orders-worker
version: 0.1.0

app:
  runtime: azure-function-nodejs@latest+dev
  envs:
    SERVICE_NAME: .params.md_metadata.name_prefix
    EVENTS_QUEUE_NAME: .dependencies.events.name

dependencies:
  events:
    resource_type: azure-storage-queue@0.1.0
    required: true

resources:
  service:
    resource_type: azure-orders-worker-service@0.1.0
    required: true

steps:
  - path: src
    resources:
      service:
        template: |
          {
            name: .outputs.function_app_name,
            function_app_id: .outputs.function_app_id
          }
