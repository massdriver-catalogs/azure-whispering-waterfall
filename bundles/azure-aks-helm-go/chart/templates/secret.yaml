# Each dependency with a connection string becomes the environment variable
# <DEPENDENCY NAME>_CONNECTION_STRING. The app secrets go here too.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $dep := .Values.dependencies }}
  {{ printf "%s_CONNECTION_STRING" ($name | upper) }}: {{ $dep.connection_string | quote }}
  {{- end }}
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
