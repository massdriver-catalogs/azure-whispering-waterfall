# The runtime puts the connection string of each dependency
# (<DEPENDENCY NAME>_CONNECTION_STRING) and the app secrets in .Values.secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
